<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="ksm-title ksm-desc">
  <title id="ksm-title">Phase VI sparse separable memory block</title>
  <desc id="ksm-desc">The residual stream is normalized to a routing coordinate, scored against M support keys by kernel distance, the top-K supports apply local affine experts, the weighted sum passes through a zero-initialized gate and is added back to the residual; geometry parameters are slow and algebra parameters are fast.</desc>
  <defs>
    <marker id="ksm-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- residual u -->
  <rect class="d-box" x="40" y="101" width="160" height="72" rx="1"/>
  <text class="d-label" x="120" y="132" text-anchor="middle">residual u</text>
  <text class="d-sub" x="120" y="157" text-anchor="middle">from attention</text>

  <!-- norm -> z -->
  <rect class="d-box" x="250" y="101" width="190" height="72" rx="1"/>
  <text class="d-label" x="345" y="132" text-anchor="middle">norm → z</text>
  <text class="d-sub" x="345" y="157" text-anchor="middle">routing coordinate</text>

  <!-- support bank (accent) -->
  <rect class="d-accent" x="490" y="60" width="350" height="154" rx="1"/>
  <text class="d-label" x="665" y="92" text-anchor="middle">support bank: top-K of M</text>
  <text class="d-sub" x="665" y="117" text-anchor="middle">s_i = −‖z−k_i‖²_D / 2τ</text>
  <!-- M support keys; the three d-dot keys are the kernel neighbourhood of z -->
  <circle class="d-box" cx="566" cy="140" r="6"/>
  <circle class="d-box" cx="600" cy="138" r="6"/>
  <circle class="d-box" cx="640" cy="142" r="6"/>
  <circle class="d-box" cx="690" cy="137" r="6"/>
  <circle class="d-box" cx="730" cy="140" r="6"/>
  <circle class="d-box" cx="762" cy="148" r="6"/>
  <circle class="d-box" cx="572" cy="172" r="6"/>
  <circle class="d-box" cx="612" cy="168" r="6"/>
  <circle class="d-box" cx="750" cy="178" r="6"/>
  <circle class="d-box" cx="568" cy="198" r="6"/>
  <circle class="d-box" cx="604" cy="200" r="6"/>
  <circle class="d-box" cx="640" cy="196" r="6"/>
  <circle class="d-box" cx="668" cy="201" r="6"/>
  <circle class="d-box" cx="722" cy="198" r="6"/>
  <circle class="d-box" cx="758" cy="200" r="6"/>
  <circle class="d-dot" cx="676" cy="166" r="6"/>
  <circle class="d-dot" cx="700" cy="163" r="6"/>
  <circle class="d-dot" cx="688" cy="184" r="6"/>
  <ellipse class="d-line d-dash" cx="688" cy="171" rx="27" ry="23"/>

  <!-- K local experts (stacked) -->
  <path class="d-line" d="M906 262 H912 V334 H662 V328"/>
  <path class="d-line" d="M900 256 H906 V328 H656 V322"/>
  <rect class="d-box" x="650" y="250" width="250" height="72" rx="1"/>
  <text class="d-label" x="775" y="281" text-anchor="middle">K local experts</text>
  <text class="d-sub" x="775" y="306" text-anchor="middle">Σ a_i (A_i u + b_i)</text>

  <!-- gate -->
  <rect class="d-box" x="400" y="250" width="190" height="72" rx="1"/>
  <text class="d-label" x="495" y="281" text-anchor="middle">gate γ · W_o</text>
  <text class="d-sub" x="495" y="306" text-anchor="middle">zero-initialized</text>

  <!-- residual add junction -->
  <circle class="d-box" cx="120" cy="286" r="18"/>
  <text class="d-label" x="120" y="293" text-anchor="middle">+</text>

  <!-- flow -->
  <path class="d-line" marker-end="url(#ksm-arr)" d="M200 137 H248"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M440 137 H488"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M775 214 V248"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M650 286 H592"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M400 286 H142"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M120 173 V264"/>
  <text class="d-sub" x="136" y="223">skip</text>
  <path class="d-line accent" marker-end="url(#ksm-arr)" d="M120 304 V350"/>
  <text class="d-sub" x="136" y="344">h⁺ → next block</text>

  <!-- parameter groups -->
  <rect class="d-soft" x="40" y="376" width="385" height="64" rx="1"/>
  <text class="d-label" x="232" y="403" text-anchor="middle">slow geometry</text>
  <text class="d-sub" x="232" y="428" text-anchor="middle">keys k_i, metric D · gradient steps</text>
  <rect class="d-soft" x="535" y="376" width="385" height="64" rx="1"/>
  <text class="d-label" x="727" y="403" text-anchor="middle">fast algebra</text>
  <text class="d-sub" x="727" y="428" text-anchor="middle">values A_i, b_i · ridge / RLS solve</text>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M480 420 H427"/>
  <path class="d-line" marker-end="url(#ksm-arr)" d="M480 420 H533"/>
  <text class="d-sub" x="480" y="400" text-anchor="middle">alternate</text>
</svg>
