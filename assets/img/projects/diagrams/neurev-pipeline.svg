<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="neurevpipeline-title neurevpipeline-desc">
  <title id="neurevpipeline-title">Grid-search detection pipeline with a human review loop</title>
  <desc id="neurevpipeline-desc">Imaging video passes through an interchangeable pre-processing filter (Gamma ST or Kalman–MCC) and then a CFAR detector that surfaces candidate events; a parallel grid search spans the filter and detector parameters. The detector output goes to evaluation and model selection by FROC and truncated AUC, and then to a report of figures and diagnostics. Candidate events also go down to a human review workbench, where ROIs and events are accepted, rejected, or marked unsure, and those labels feed back into the grid search.</desc>
  <defs>
    <marker id="neurevpipeline-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- grid-search group spanning filter + detector -->
  <rect class="d-soft" x="256" y="48" width="488" height="146" rx="1"/>
  <text class="d-label" x="500" y="84" text-anchor="middle">parallel grid search</text>

  <!-- row 1: input, filter, detector -->
  <rect class="d-box" x="40" y="108" width="200" height="72" rx="1"/>
  <text class="d-label" x="140" y="141" text-anchor="middle">Imaging video</text>
  <text class="d-sub" x="140" y="165" text-anchor="middle">voltage · calcium</text>

  <rect class="d-box" x="270" y="108" width="232" height="72" rx="1"/>
  <text class="d-label" x="386" y="141" text-anchor="middle">Filter (swap)</text>
  <text class="d-sub" x="386" y="165" text-anchor="middle">Gamma ST · Kalman–MCC</text>

  <rect class="d-accent" x="530" y="108" width="200" height="72" rx="1"/>
  <text class="d-label" x="630" y="141" text-anchor="middle">CFAR detector</text>
  <text class="d-sub" x="630" y="165" text-anchor="middle">candidate events</text>

  <!-- right column: evaluate + select, report -->
  <rect class="d-box" x="664" y="240" width="256" height="72" rx="1"/>
  <text class="d-label" x="792" y="273" text-anchor="middle">Evaluate + select</text>
  <text class="d-sub" x="792" y="297" text-anchor="middle">FROC · truncated AUC</text>

  <rect class="d-box" x="664" y="360" width="256" height="72" rx="1"/>
  <text class="d-label" x="792" y="393" text-anchor="middle">Report</text>
  <text class="d-sub" x="792" y="417" text-anchor="middle">figures + diagnostics</text>

  <!-- bottom-left: human review workbench -->
  <rect class="d-box" x="40" y="360" width="500" height="72" rx="1"/>
  <text class="d-label" x="290" y="393" text-anchor="middle">Human review workbench</text>
  <text class="d-sub" x="290" y="417" text-anchor="middle">ROI + event accept / reject / unsure</text>

  <!-- main flow -->
  <path class="d-line" d="M240,144 H268" marker-end="url(#neurevpipeline-arr)"/>
  <path class="d-line" d="M502,144 H528" marker-end="url(#neurevpipeline-arr)"/>
  <path class="d-line" d="M730,144 H792 V238" marker-end="url(#neurevpipeline-arr)"/>
  <path class="d-line" d="M792,312 V358" marker-end="url(#neurevpipeline-arr)"/>

  <!-- human review loop -->
  <path class="d-line d-dash" d="M630,180 V396 H542" marker-end="url(#neurevpipeline-arr)"/>
  <text class="d-sub" x="612" y="285" text-anchor="end">candidates</text>
  <path class="d-line d-dash" d="M386,360 V196" marker-end="url(#neurevpipeline-arr)"/>
  <text class="d-sub" x="368" y="285" text-anchor="end">labels feed back</text>
</svg>
