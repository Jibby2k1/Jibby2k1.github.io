<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="timeseriesrun-title timeseriesrun-desc">
  <title id="timeseriesrun-title">One config, one command, one auditable run folder</title>
  <desc id="timeseriesrun-desc">A config file of dataset, model, and seed feeds one command that trains, evaluates, and plots, producing an auditable run folder in a standardized layout: a config snapshot, metrics and logs, and plots. Because every run folder has the same layout, run A and run B compare on the same metric and the same plot, every time.</desc>
  <defs>
    <marker id="timeseriesrun-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- row 1: declare, then run -->
  <rect class="d-box" x="196" y="40" width="256" height="72" rx="1"/>
  <text class="d-label" x="324" y="71" text-anchor="middle">config.yaml</text>
  <text class="d-sub" x="324" y="95" text-anchor="middle">dataset · model · seed</text>

  <path class="d-line" d="M452,76 H506" marker-end="url(#timeseriesrun-arr)"/>

  <rect class="d-box" x="508" y="40" width="256" height="72" rx="1"/>
  <text class="d-label" x="636" y="71" text-anchor="middle">one command</text>
  <text class="d-sub" x="636" y="95" text-anchor="middle">train → evaluate → plot</text>

  <path class="d-line" d="M636,112 V130 H480 V146" marker-end="url(#timeseriesrun-arr)"/>

  <!-- row 2: the auditable run folder (subject) -->
  <rect class="d-accent" x="40" y="148" width="880" height="152" rx="1"/>
  <text class="d-label" x="480" y="180" text-anchor="middle">auditable run folder</text>
  <text class="d-sub" x="480" y="202" text-anchor="middle">standardized layout, every run</text>

  <rect class="d-box" x="60" y="222" width="264" height="64" rx="1"/>
  <text class="d-label" x="192" y="249" text-anchor="middle">config snapshot</text>
  <text class="d-sub" x="192" y="271" text-anchor="middle">the exact config used</text>

  <rect class="d-box" x="348" y="222" width="264" height="64" rx="1"/>
  <text class="d-label" x="480" y="249" text-anchor="middle">metrics + logs</text>
  <text class="d-sub" x="480" y="271" text-anchor="middle">metrics.json, run.log</text>

  <rect class="d-box" x="636" y="222" width="264" height="64" rx="1"/>
  <text class="d-label" x="768" y="249" text-anchor="middle">plots/</text>
  <text class="d-sub" x="768" y="271" text-anchor="middle">same figure every run</text>

  <path class="d-line" d="M480,300 V338" marker-end="url(#timeseriesrun-arr)"/>

  <!-- row 3: comparison -->
  <rect class="d-soft" x="40" y="340" width="880" height="100" rx="1"/>
  <text class="d-label" x="60" y="385">compare runs</text>
  <text class="d-sub" x="60" y="409">same metric, same plot, every time</text>

  <path class="d-line" d="M560,352 V428"/>
  <rect class="d-fill" x="562" y="358" width="320" height="24"/>
  <rect class="d-fill" x="562" y="398" width="200" height="24"/>
  <text class="d-sub" x="540" y="375" text-anchor="end">run A</text>
  <text class="d-sub" x="540" y="415" text-anchor="end">run B</text>
</svg>
