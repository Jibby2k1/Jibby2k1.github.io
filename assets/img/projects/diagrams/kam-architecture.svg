<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="kamarchitecture-title kamarchitecture-desc">
  <title id="kamarchitecture-title">Kernel Adaptive Memory architecture</title>
  <desc id="kamarchitecture-desc">A sequence of tokens forks into two branches: causal radial-kernel context attention over a local window, and a learned bank of persistent key/value supports. Both feed a residual block whose output goes to the readout. An optional online NLMS update adapts only the readout.</desc>
  <defs>
    <marker id="kamarchitecture-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <!-- connectors -->
  <path class="d-line" d="M250 240 H275"/>
  <path class="d-line" marker-end="url(#kamarchitecture-arr)" d="M275 240 V92 Q275 84 283 84 H298"/>
  <path class="d-line" marker-end="url(#kamarchitecture-arr)" d="M275 240 V388 Q275 396 283 396 H298"/>
  <path class="d-line" marker-end="url(#kamarchitecture-arr)" d="M590 84 H638"/>
  <path class="d-line accent" marker-end="url(#kamarchitecture-arr)" d="M590 396 H609 Q615 396 615 390 V112 Q615 106 621 106 H638"/>
  <path class="d-line" marker-end="url(#kamarchitecture-arr)" d="M780 120 V202"/>
  <path class="d-line d-dash" marker-end="url(#kamarchitecture-arr)" d="M780 360 V278"/>
  <circle class="d-dot" cx="275" cy="240" r="5"/>

  <!-- sequence (input, centred on the whole) -->
  <rect class="d-box" x="40" y="204" width="210" height="72" rx="1"/>
  <text class="d-label" x="145" y="235" text-anchor="middle">sequence</text>
  <text class="d-sub" x="145" y="259" text-anchor="middle">tokens / lags</text>

  <!-- context attention (top branch) -->
  <rect class="d-box" x="300" y="48" width="290" height="72" rx="1"/>
  <text class="d-label" x="445" y="79" text-anchor="middle">context attention</text>
  <text class="d-sub" x="445" y="103" text-anchor="middle">radial score · window W</text>

  <!-- persistent supports (bottom branch, accent) -->
  <rect class="d-accent" x="300" y="360" width="290" height="72" rx="1"/>
  <text class="d-label" x="445" y="391" text-anchor="middle">persistent supports</text>
  <text class="d-sub" x="445" y="415" text-anchor="middle">learned key/value bank M</text>

  <!-- residual block -->
  <rect class="d-box" x="640" y="48" width="280" height="72" rx="1"/>
  <text class="d-label" x="780" y="79" text-anchor="middle">residual block</text>
  <text class="d-sub" x="780" y="103" text-anchor="middle">FFN + normalization</text>

  <!-- readout -->
  <rect class="d-box" x="640" y="204" width="280" height="72" rx="1"/>
  <text class="d-label" x="780" y="235" text-anchor="middle">readout</text>
  <text class="d-sub" x="780" y="259" text-anchor="middle">prediction</text>

  <!-- optional online NLMS (adapts the readout only) -->
  <rect class="d-box d-dash" x="640" y="360" width="280" height="72" rx="1"/>
  <text class="d-label" x="780" y="391" text-anchor="middle">online NLMS update</text>
  <text class="d-sub" x="780" y="415" text-anchor="middle">optional · readout only</text>
</svg>
