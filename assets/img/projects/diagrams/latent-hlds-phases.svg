<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="latenthldsphases-title latenthldsphases-desc">
  <title id="latenthldsphases-title">HLDS training and inference phases</title>
  <desc id="latenthldsphases-desc">Two separated phases. Training: observed data feed a dual Kalman loop that alternates inferring hidden states and updating parameters over multiple passes, yielding learned transition and emission parameters θ. Inference: θ is handed over and frozen; a Kalman recursion turns a new held-out sequence into a latent trajectory that a classifier turns into a class label.</desc>
  <defs>
    <marker id="latenthldsphases-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- Training phase: one column, top to bottom -->
  <rect class="d-soft" x="40" y="40" width="278" height="400" rx="1"/>
  <text class="d-sub" x="179" y="72" text-anchor="middle">Training · learn θ</text>

  <rect class="d-box" x="54" y="100" width="250" height="72" rx="1"/>
  <text class="d-label" x="179" y="131" text-anchor="middle">Observed data</text>
  <text class="d-sub" x="179" y="155" text-anchor="middle">cleaned + aligned</text>

  <rect class="d-box" x="54" y="212" width="250" height="72" rx="1"/>
  <text class="d-label" x="179" y="243" text-anchor="middle">Dual Kalman loop</text>
  <text class="d-sub" x="179" y="267" text-anchor="middle">infer states, update θ</text>

  <rect class="d-accent" x="54" y="324" width="250" height="72" rx="1"/>
  <text class="d-label" x="179" y="355" text-anchor="middle">Learned θ</text>
  <text class="d-sub" x="179" y="379" text-anchor="middle">transition + emission</text>

  <path class="d-line" d="M179,172 V210" marker-end="url(#latenthldsphases-arr)"/>
  <path class="d-line" d="M179,284 V322" marker-end="url(#latenthldsphases-arr)"/>

  <!-- Inference phase: 2 x 2, flow down, right, up -->
  <rect class="d-soft" x="356" y="40" width="564" height="400" rx="1"/>
  <text class="d-sub" x="638" y="72" text-anchor="middle">Inference · θ frozen</text>

  <rect class="d-box" x="370" y="100" width="250" height="72" rx="1"/>
  <text class="d-label" x="495" y="131" text-anchor="middle">New sequence</text>
  <text class="d-sub" x="495" y="155" text-anchor="middle">held-out epoch</text>

  <rect class="d-box" x="370" y="324" width="250" height="72" rx="1"/>
  <text class="d-label" x="495" y="355" text-anchor="middle">Kalman recursion</text>
  <text class="d-sub" x="495" y="379" text-anchor="middle">parameters frozen</text>

  <rect class="d-box" x="656" y="324" width="250" height="72" rx="1"/>
  <text class="d-label" x="781" y="355" text-anchor="middle">Latent trajectory</text>
  <text class="d-sub" x="781" y="379" text-anchor="middle">hidden-state encoding</text>

  <rect class="d-box" x="656" y="100" width="250" height="72" rx="1"/>
  <text class="d-label" x="781" y="131" text-anchor="middle">Classifier</text>
  <text class="d-sub" x="781" y="155" text-anchor="middle">class / label</text>

  <path class="d-line" d="M495,172 V322" marker-end="url(#latenthldsphases-arr)"/>
  <path class="d-line" d="M620,360 H654" marker-end="url(#latenthldsphases-arr)"/>
  <path class="d-line" d="M781,324 V174" marker-end="url(#latenthldsphases-arr)"/>

  <!-- θ hand-off: learned in training, frozen for inference (same row, straight across) -->
  <path class="d-line accent d-dash" d="M304,360 H368" marker-end="url(#latenthldsphases-arr)"/>
</svg>
