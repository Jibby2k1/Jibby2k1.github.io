<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="timeseriesmodelzoo-title timeseriesmodelzoo-desc">
  <title id="timeseriesmodelzoo-title">Model library behind one experiment runner</title>
  <desc id="timeseriesmodelzoo-desc">Three model families — kernel filters (QKLMS, KRLS, KRR, GPR), functional and Wiener filters (FWF, FWFE, FKF, ASLM), and configurable neural networks (ITL auto-encoder, GPU) — merge onto one bus that enters a single unified runner. Benchmark signals (Mackey–Glass, Lorenz, Hénon, Sunspot) feed the runner, which reports train and test MSE with the same metric and plot for every model.</desc>
  <defs>
    <marker id="timeseriesmodelzoo-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- model families (3 x 276, 26px gutters; centres 178 / 480 / 782) -->
  <rect class="d-box" x="40" y="88" width="276" height="72" rx="1"/>
  <text class="d-label" x="178" y="119" text-anchor="middle">Kernel filters</text>
  <text class="d-sub" x="178" y="143" text-anchor="middle">QKLMS, KRLS, KRR, GPR</text>

  <rect class="d-box" x="342" y="88" width="276" height="72" rx="1"/>
  <text class="d-label" x="480" y="119" text-anchor="middle">Functional / Wiener</text>
  <text class="d-sub" x="480" y="143" text-anchor="middle">FWF, FWFE, FKF, ASLM</text>

  <rect class="d-box" x="644" y="88" width="276" height="72" rx="1"/>
  <text class="d-label" x="782" y="119" text-anchor="middle">Configurable NNs</text>
  <text class="d-sub" x="782" y="143" text-anchor="middle">ITL auto-encoder, GPU</text>

  <!-- one interface: every family drops onto one bus; the junction under the middle family feeds the runner -->
  <path class="d-line" d="M178,160 V240 H782 V160"/>
  <path class="d-line" d="M480,160 V240"/>
  <path class="d-line" d="M480,240 V318" marker-end="url(#timeseriesmodelzoo-arr)"/>
  <circle class="d-dot" cx="480" cy="240" r="5"/>

  <!-- shared harness: signals in, comparable error out (same 3-column grid as above) -->
  <rect class="d-box" x="40" y="320" width="276" height="72" rx="1"/>
  <text class="d-label" x="178" y="351" text-anchor="middle">Benchmark signals</text>
  <text class="d-sub" x="178" y="375" text-anchor="middle">MG, Lorenz, Hénon, Sunspot</text>

  <path class="d-line" d="M316,356 H340" marker-end="url(#timeseriesmodelzoo-arr)"/>

  <rect class="d-accent" x="342" y="320" width="276" height="72" rx="1"/>
  <text class="d-label" x="480" y="351" text-anchor="middle">Unified runner</text>
  <text class="d-sub" x="480" y="375" text-anchor="middle">one config → one run</text>

  <path class="d-line" d="M618,356 H642" marker-end="url(#timeseriesmodelzoo-arr)"/>

  <rect class="d-box" x="644" y="320" width="276" height="72" rx="1"/>
  <text class="d-label" x="782" y="351" text-anchor="middle">Train / test MSE</text>
  <text class="d-sub" x="782" y="375" text-anchor="middle">same metric + plot</text>
</svg>
