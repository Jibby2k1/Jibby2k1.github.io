<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">CFD surrogate modeling pipeline</title>
  <desc id="desc">High-fidelity CFD solver runs and PDE constraints train three surrogate families — neural operators, mesh graph networks, and latent dynamics — which produce fast predictions that are audited for rollout stability and physical consistency.</desc>
  <!-- Colors are baked (light plate) instead of currentColor so the diagram stays
       legible when referenced as a card <img>, where CSS variables cannot reach. -->
  <style>
    .box { fill: rgba(255,255,255,.55); stroke: #2c241d; stroke-width: 1.5; }
    .accent { fill: rgba(138,90,43,.12); stroke: #8a5a2b; stroke-width: 2; }
    .line { fill: none; stroke: #4a4238; stroke-width: 2; marker-end: url(#arrow-cfd); opacity: .8; }
    .label { font-family: ui-monospace, "IBM Plex Mono", Consolas, monospace; font-size: 15px; fill: #2c241d; }
    .small { font-family: ui-monospace, "IBM Plex Mono", Consolas, monospace; font-size: 12px; fill: #6b6156; }
    .title { font-family: ui-monospace, "IBM Plex Mono", Consolas, monospace; font-size: 16px; font-weight: 700; fill: #2c241d; }
  </style>
  <defs>
    <marker id="arrow-cfd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a4238"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="14" fill="#fbf7ef" stroke="#d8cfc0"/>
  <text class="title" x="30" y="36">CFD surrogate modeling</text>
  <text class="small" x="30" y="57">learn from expensive solver runs · predict fast · audit against the physics</text>
  <rect class="box" x="30" y="140" width="170" height="92" rx="12"/>
  <text class="label" x="115" y="172" text-anchor="middle">high-fidelity CFD</text>
  <text class="small" x="115" y="195" text-anchor="middle">PDE solver runs</text>
  <text class="small" x="115" y="213" text-anchor="middle">hours per case</text>
  <rect class="box" x="30" y="300" width="170" height="88" rx="12"/>
  <text class="label" x="115" y="330" text-anchor="middle">PDE constraints</text>
  <text class="small" x="115" y="352" text-anchor="middle">residual losses</text>
  <text class="small" x="115" y="370" text-anchor="middle">conservation terms</text>
  <rect class="accent" x="260" y="95" width="220" height="70" rx="12"/>
  <text class="label" x="370" y="124" text-anchor="middle">neural operators</text>
  <text class="small" x="370" y="145" text-anchor="middle">FNO · DeepONet</text>
  <rect class="accent" x="260" y="180" width="220" height="70" rx="12"/>
  <text class="label" x="370" y="209" text-anchor="middle">mesh graph networks</text>
  <text class="small" x="370" y="230" text-anchor="middle">unstructured geometry</text>
  <rect class="accent" x="260" y="265" width="220" height="70" rx="12"/>
  <text class="label" x="370" y="294" text-anchor="middle">latent dynamics</text>
  <text class="small" x="370" y="315" text-anchor="middle">reduced-order states</text>
  <rect class="box" x="550" y="175" width="170" height="82" rx="12"/>
  <text class="label" x="635" y="207" text-anchor="middle">fast surrogate</text>
  <text class="small" x="635" y="230" text-anchor="middle">milliseconds per case</text>
  <rect class="box" x="780" y="170" width="155" height="92" rx="12"/>
  <text class="label" x="857" y="202" text-anchor="middle">evaluation</text>
  <text class="small" x="857" y="225" text-anchor="middle">rollout stability</text>
  <text class="small" x="857" y="243" text-anchor="middle">physics audits</text>
  <path class="line" d="M200 186 C228 186 228 130 260 130"/>
  <path class="line" d="M200 186 C228 186 228 215 260 215"/>
  <path class="line" d="M200 186 C228 186 228 300 260 300"/>
  <path class="line" d="M200 344 C228 344 228 318 260 318"/>
  <path class="line" d="M480 130 C515 130 515 205 550 205"/>
  <path class="line" d="M480 215 H550"/>
  <path class="line" d="M480 300 C515 300 515 228 550 228"/>
  <path class="line" d="M720 216 H780"/>
  <text class="small" x="30" y="412">Active research in the SmartDATA Lab at UF since Fall 2025: where can a learned surrogate be trusted, and where does it break?</text>
</svg>
