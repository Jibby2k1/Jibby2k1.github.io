  <title id="latentstatespace-title">State-space view of a hierarchical linear dynamical system</title>
  <desc id="latentstatespace-desc">Two rows: an observed row of three noisy signal channels, and a hidden row with a chain of latent states z(t−1), z(t), z(t+1) linked by transition arrows labelled evolves. Dashed arrows labelled generates rise from each hidden state to the observed channels.</desc>
