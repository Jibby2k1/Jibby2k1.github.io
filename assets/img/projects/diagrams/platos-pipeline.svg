<svg viewBox="0 0 780 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .num{ font-family: var(--mono, monospace); font-size:14px; font-weight:700; fill: currentColor; }
    .ttl{ font-family: var(--mono, monospace); font-size:11.5px; font-weight:700; fill: currentColor; }
    .sub{ font-family: var(--mono, monospace); font-size:9.5px; fill: currentColor; opacity:0.6; }
    .node{ fill: var(--surface-strong, #fff); stroke: currentColor; stroke-width:1.5; }
    .node-final{ fill: var(--section-accent); stroke: var(--section-accent); }
    .numf{ fill: var(--paper-3, #fff); }
    .rail{ stroke: currentColor; stroke-width:1.5; fill:none; }
    .acf{ fill: var(--section-accent); }
  </style>

  <!-- rail -->
  <line class="rail" x1="66" y1="60" x2="670" y2="60"/>
  <g class="acf">
    <path d="M182 55 l9 5 -9 5 z"/><path d="M302 55 l9 5 -9 5 z"/>
    <path d="M422 55 l9 5 -9 5 z"/><path d="M542 55 l9 5 -9 5 z"/><path d="M662 55 l9 5 -9 5 z"/>
  </g>

  <!-- nodes -->
  <g>
    <circle class="node" cx="66" cy="60" r="21"/><text class="num" x="61" y="65">1</text>
    <text class="ttl" x="66" y="100" text-anchor="middle">Validate</text>
    <text class="sub" x="66" y="116" text-anchor="middle">PDF / URL →</text>
    <text class="sub" x="66" y="128" text-anchor="middle">full text</text>
  </g>
  <g>
    <circle class="node" cx="186" cy="60" r="21"/><text class="num" x="181" y="65">2</text>
    <text class="ttl" x="186" y="100" text-anchor="middle">Decompose</text>
    <text class="sub" x="186" y="116" text-anchor="middle">LLM →</text>
    <text class="sub" x="186" y="128" text-anchor="middle">atomic claims</text>
  </g>
  <g>
    <circle class="node" cx="306" cy="60" r="21"/><text class="num" x="301" y="65">3</text>
    <text class="ttl" x="306" y="100" text-anchor="middle">Build graph</text>
    <text class="sub" x="306" y="116" text-anchor="middle">role-aware</text>
    <text class="sub" x="306" y="128" text-anchor="middle">DAG</text>
  </g>
  <g>
    <circle class="node" cx="426" cy="60" r="21"/><text class="num" x="421" y="65">4</text>
    <text class="ttl" x="426" y="100" text-anchor="middle">Agents</text>
    <text class="sub" x="426" y="116" text-anchor="middle">browser-verify</text>
    <text class="sub" x="426" y="128" text-anchor="middle">each claim</text>
  </g>
  <g>
    <circle class="node" cx="546" cy="60" r="21"/><text class="num" x="541" y="65">5</text>
    <text class="ttl" x="546" y="100" text-anchor="middle">Compile</text>
    <text class="sub" x="546" y="116" text-anchor="middle">score 6</text>
    <text class="sub" x="546" y="128" text-anchor="middle">dimensions</text>
  </g>
  <g>
    <circle class="node node-final" cx="666" cy="60" r="21"/><text class="num numf" x="661" y="65">6</text>
    <text class="ttl" x="666" y="100" text-anchor="middle">Integrity</text>
    <text class="sub" x="666" y="116" text-anchor="middle">trust-gated</text>
    <text class="sub" x="666" y="128" text-anchor="middle">propagation</text>
  </g>

  <!-- output -->
  <g>
    <rect class="node" x="560" y="168" width="212" height="52" rx="2"/>
    <text class="sub" x="574" y="188">OUTPUT</text>
    <text class="ttl" x="574" y="207">Paper-level integrity score + audit trail</text>
    <path class="rail" d="M666 81 v72 h-6" />
    <path class="acf" d="M665 148 l-5 9 -5 -9 z" transform="translate(0,4)"/>
  </g>

  <text class="sub" x="8" y="240">A claim's score is gated by the trust of the claims it depends on — weak premises cap strong-sounding conclusions.</text>
</svg>
