<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="platospipeline-title platospipeline-desc">
  <title id="platospipeline-title">Plato's Cave six-stage verification pipeline</title>
  <desc id="platospipeline-desc">Six-stage pipeline: validate a PDF or URL into full text, decompose it into atomic claims with an LLM, build a role-aware claim DAG, dispatch browser agents to verify each claim, compile scores on six dimensions, and evaluate integrity by trust-gated propagation through the graph, producing a paper-level integrity score with an audit trail.</desc>
  <defs>
    <marker id="platospipeline-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- row 1: stages 1-3 -->
  <rect class="d-box" x="40" y="50" width="264" height="76" rx="1"/>
  <text class="d-label" x="172" y="82" text-anchor="middle">1 · Validate</text>
  <text class="d-sub" x="172" y="105" text-anchor="middle">PDF / URL → full text</text>

  <rect class="d-box" x="348" y="50" width="264" height="76" rx="1"/>
  <text class="d-label" x="480" y="82" text-anchor="middle">2 · Decompose</text>
  <text class="d-sub" x="480" y="105" text-anchor="middle">LLM → atomic claims</text>

  <rect class="d-box" x="656" y="50" width="264" height="76" rx="1"/>
  <text class="d-label" x="788" y="82" text-anchor="middle">3 · Build graph</text>
  <text class="d-sub" x="788" y="105" text-anchor="middle">role-aware DAG</text>

  <!-- row 2: stages 4-6 -->
  <rect class="d-box" x="40" y="202" width="264" height="76" rx="1"/>
  <text class="d-label" x="172" y="234" text-anchor="middle">4 · Agents</text>
  <text class="d-sub" x="172" y="257" text-anchor="middle">browser-verify each claim</text>

  <rect class="d-box" x="348" y="202" width="264" height="76" rx="1"/>
  <text class="d-label" x="480" y="234" text-anchor="middle">5 · Compile</text>
  <text class="d-sub" x="480" y="257" text-anchor="middle">score 6 dimensions</text>

  <rect class="d-accent" x="656" y="202" width="264" height="76" rx="1"/>
  <text class="d-label" x="788" y="234" text-anchor="middle">6 · Integrity</text>
  <text class="d-sub" x="788" y="257" text-anchor="middle">trust-gated propagation</text>

  <!-- output, centred under the grid -->
  <rect class="d-box" x="348" y="354" width="264" height="76" rx="1"/>
  <text class="d-label" x="480" y="386" text-anchor="middle">Integrity score</text>
  <text class="d-sub" x="480" y="409" text-anchor="middle">paper-level + audit trail</text>

  <!-- connectors -->
  <path class="d-line" d="M304,88 H346" marker-end="url(#platospipeline-arr)"/>
  <path class="d-line" d="M612,88 H654" marker-end="url(#platospipeline-arr)"/>
  <path class="d-line" d="M788,126 V164 H172 V200" marker-end="url(#platospipeline-arr)"/>
  <path class="d-line" d="M304,240 H346" marker-end="url(#platospipeline-arr)"/>
  <path class="d-line" d="M612,240 H654" marker-end="url(#platospipeline-arr)"/>
  <path class="d-line" d="M788,278 V316 H480 V352" marker-end="url(#platospipeline-arr)"/>
</svg>
