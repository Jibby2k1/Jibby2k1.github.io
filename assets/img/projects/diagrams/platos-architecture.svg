<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="platosarchitecture-title platosarchitecture-desc">
  <title id="platosarchitecture-title">Plato's Cave deployed architecture</title>
  <desc id="platosarchitecture-desc">Inside one AWS EC2 Docker deployment, a Gatsby.js and React frontend sends work to a Python scoring backend, which dispatches browser-use verification agents running in containers; the agents return evidence per claim to the backend.</desc>
  <defs>
    <marker id="platosarchitecture-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path class="d-arrow" d="M0,0 L10,5 L0,10 Z"/></marker>
  </defs>

  <!-- host boundary: one EC2 deployment, Docker -->
  <rect class="d-soft d-dash" x="40" y="104" width="880" height="272" rx="1"/>
  <text class="d-label" x="480" y="138" text-anchor="middle">deployed on AWS EC2 · Docker</text>

  <!-- frontend -->
  <rect class="d-box" x="76" y="190" width="228" height="72" rx="1"/>
  <text class="d-label" x="190" y="221" text-anchor="middle">Frontend</text>
  <text class="d-sub" x="190" y="245" text-anchor="middle">Gatsby.js + React</text>

  <!-- scoring backend (highlighted) -->
  <rect class="d-accent" x="354" y="190" width="228" height="72" rx="1"/>
  <text class="d-label" x="468" y="221" text-anchor="middle">Scoring backend</text>
  <text class="d-sub" x="468" y="245" text-anchor="middle">Python · 6-dim scorer</text>

  <!-- verification agents: stack of containers (two back layers, 12px steps) -->
  <path class="d-box" d="M656,178 V166 H884 V238 H872"/>
  <path class="d-box" d="M644,190 V178 H872 V250 H860"/>
  <rect class="d-box" x="632" y="190" width="228" height="72" rx="1"/>
  <text class="d-label" x="746" y="221" text-anchor="middle">Browser agents</text>
  <text class="d-sub" x="746" y="245" text-anchor="middle">browser-use · Docker</text>

  <!-- forward flow -->
  <path class="d-line" d="M304,226 H352" marker-end="url(#platosarchitecture-arr)"/>
  <path class="d-line" d="M582,226 H630" marker-end="url(#platosarchitecture-arr)"/>

  <!-- evidence returned to the backend -->
  <path class="d-line d-dash" d="M746,262 V310 H468 V264" marker-end="url(#platosarchitecture-arr)"/>
  <text class="d-sub" x="607" y="342" text-anchor="middle">evidence per claim</text>
</svg>
