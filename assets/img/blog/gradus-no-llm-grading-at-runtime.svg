<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="gradus-nollm-title gradus-nollm-desc" style="font-family: var(--mono, ui-monospace, monospace); color: currentColor;">
  <title id="gradus-nollm-title">Gradus: content factory, validation gate, deterministic runtime</title>
  <desc id="gradus-nollm-desc">Two boxes connected by a gate. On the left, an authoring content factory where a language model drafts course packages. In the middle, a validation gate listing schema, strict LaTeX, and substance audit checks, with a rejected branch that regenerates flagged families. On the right, the runtime box marked no LLM, where a learner answer is normalized and graded, diagnosed against twelve error types, and routed to a repair target by a backward search over prerequisites.</desc>

  <!-- Authoring content factory -->
  <rect x="60" y="150" width="380" height="440" rx="18" fill="currentColor" opacity="0.04"/>
  <rect x="60" y="150" width="380" height="440" rx="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="250" y="120" text-anchor="middle" font-size="26" fill="currentColor">AUTHORING</text>
  <text x="250" y="200" text-anchor="middle" font-size="24" fill="currentColor" opacity="0.85">content factory</text>

  <!-- LLM chip inside factory -->
  <rect x="120" y="240" width="260" height="70" rx="12" fill="var(--section-accent, currentColor)" opacity="0.14"/>
  <rect x="120" y="240" width="260" height="70" rx="12" fill="none" stroke="var(--section-accent, currentColor)" stroke-width="2.5"/>
  <text x="250" y="284" text-anchor="middle" font-size="24" fill="currentColor">language model</text>

  <!-- draft package stack -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="150" y="360" width="200" height="130" rx="8" opacity="0.35"/>
    <rect x="165" y="375" width="200" height="130" rx="8" opacity="0.6"/>
    <rect x="180" y="390" width="200" height="130" rx="8"/>
  </g>
  <text x="280" y="440" text-anchor="middle" font-size="22" fill="currentColor">course</text>
  <text x="280" y="470" text-anchor="middle" font-size="22" fill="currentColor">package</text>
  <text x="250" y="560" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.7">drafts, sidecars, narration</text>

  <!-- arrow factory -> gate -->
  <g stroke="currentColor" stroke-width="3" fill="none">
    <path d="M440 370 H505"/>
    <path d="M492 358 L508 370 L492 382"/>
  </g>

  <!-- Validation gate -->
  <rect x="510" y="250" width="180" height="240" rx="14" fill="var(--section-accent, currentColor)" opacity="0.12"/>
  <rect x="510" y="250" width="180" height="240" rx="14" fill="none" stroke="var(--section-accent, currentColor)" stroke-width="3"/>
  <text x="600" y="120" text-anchor="middle" font-size="26" fill="currentColor">GATE</text>
  <text x="600" y="295" text-anchor="middle" font-size="22" fill="currentColor">schema</text>
  <text x="600" y="345" text-anchor="middle" font-size="22" fill="currentColor">strict LaTeX</text>
  <text x="600" y="395" text-anchor="middle" font-size="22" fill="currentColor">substance</text>
  <text x="600" y="425" text-anchor="middle" font-size="22" fill="currentColor">audit</text>
  <!-- rejected branch -->
  <g stroke="currentColor" stroke-width="2" fill="none" opacity="0.55">
    <path d="M600 490 V560"/>
    <path d="M588 548 L600 562 L612 548"/>
  </g>
  <text x="600" y="600" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.7">rejected:</text>
  <text x="600" y="630" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.7">regenerate</text>

  <!-- arrow gate -> runtime -->
  <g stroke="currentColor" stroke-width="3" fill="none">
    <path d="M690 370 H755"/>
    <path d="M742 358 L758 370 L742 382"/>
  </g>

  <!-- Runtime -->
  <rect x="760" y="150" width="380" height="440" rx="18" fill="currentColor" opacity="0.04"/>
  <rect x="760" y="150" width="380" height="440" rx="18" fill="none" stroke="currentColor" stroke-width="3"/>
  <text x="950" y="120" text-anchor="middle" font-size="26" fill="currentColor">RUNTIME</text>

  <!-- no LLM badge -->
  <rect x="860" y="176" width="180" height="46" rx="23" fill="var(--section-accent, currentColor)" opacity="0.16"/>
  <rect x="860" y="176" width="180" height="46" rx="23" fill="none" stroke="var(--section-accent, currentColor)" stroke-width="2.5"/>
  <text x="950" y="208" text-anchor="middle" font-size="24" font-weight="bold" fill="currentColor">no LLM</text>

  <!-- pipeline inside runtime -->
  <g fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="800" y="250" width="300" height="60" rx="10"/>
    <rect x="800" y="340" width="300" height="60" rx="10"/>
    <rect x="800" y="430" width="300" height="60" rx="10"/>
    <path d="M950 310 V332"/>
    <path d="M940 324 L950 336 L960 324"/>
    <path d="M950 400 V422"/>
    <path d="M940 414 L950 426 L960 414"/>
  </g>
  <text x="950" y="288" text-anchor="middle" font-size="22" fill="currentColor">grade: normalize</text>
  <text x="950" y="378" text-anchor="middle" font-size="22" fill="currentColor">diagnose: 12 types</text>
  <text x="950" y="468" text-anchor="middle" font-size="22" fill="currentColor">repair: backward BFS</text>

  <!-- learner answer in / next question out -->
  <g stroke="currentColor" stroke-width="2.5" fill="none">
    <path d="M950 660 V600"/>
    <path d="M940 612 L950 598 L960 612"/>
  </g>
  <text x="950" y="700" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.8">answer in, next question out</text>

  <!-- footer legend -->
  <text x="250" y="700" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.8">model drafts, gate checks</text>
</svg>
