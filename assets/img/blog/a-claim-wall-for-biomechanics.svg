<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="cw-title cw-desc" style="font-family: var(--mono, ui-monospace, monospace); color: inherit;">
  <title id="cw-title">The claim wall</title>
  <desc id="cw-desc">A brick wall separates nine allowed mechanics outputs on the left from nine barred outputs on the right. The only opening is a gated door labeled reviewed decision, with a named validation bar beneath it.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <text x="280" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-size="30" font-weight="bold">allowed outputs</text>
    <text x="280" y="118" text-anchor="middle" fill="currentColor" stroke="none" font-size="22" opacity="0.65">AllowedMechanicsOutputV1</text>
    <text x="920" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-size="30" font-weight="bold">barred outputs</text>
    <text x="920" y="118" text-anchor="middle" fill="currentColor" stroke="none" font-size="22" opacity="0.65">UnavailableMechanicsOutputV1</text>

    <rect x="70" y="150" width="420" height="500" rx="14" fill="currentColor" fill-opacity="0.05"/>
    <g font-size="24" fill="currentColor" stroke="none">
      <text x="110" y="200">modeled position</text>
      <text x="110" y="250">external force</text>
      <text x="110" y="300">moment arm</text>
      <text x="110" y="350">external joint moment</text>
      <text x="110" y="400">balancing joint moment</text>
      <text x="110" y="450">moment summary</text>
      <text x="110" y="500">setup A vs B difference</text>
      <text x="110" y="550">sensitivity</text>
      <text x="110" y="600">bounded uncertainty</text>
    </g>
    <g stroke="var(--section-accent, currentColor)" stroke-width="3">
      <path d="M84 195 l8 8 l14 -16"/>
      <path d="M84 245 l8 8 l14 -16"/>
      <path d="M84 295 l8 8 l14 -16"/>
      <path d="M84 345 l8 8 l14 -16"/>
      <path d="M84 395 l8 8 l14 -16"/>
      <path d="M84 445 l8 8 l14 -16"/>
      <path d="M84 495 l8 8 l14 -16"/>
      <path d="M84 545 l8 8 l14 -16"/>
      <path d="M84 595 l8 8 l14 -16"/>
    </g>

    <rect x="710" y="150" width="420" height="500" rx="14" stroke-dasharray="8 8" opacity="0.7"/>
    <g font-size="24" fill="currentColor" stroke="none" opacity="0.8">
      <text x="750" y="200">muscle activation</text>
      <text x="750" y="250">individual muscle force</text>
      <text x="750" y="300">joint contact force</text>
      <text x="750" y="350">tendon force</text>
      <text x="750" y="400">ligament stress</text>
      <text x="750" y="450">tissue stress</text>
      <text x="750" y="500">injury probability</text>
      <text x="750" y="550">medical interpretation</text>
      <text x="750" y="600">3D dynamics</text>
    </g>
    <g opacity="0.7" stroke-width="2.5">
      <path d="M724 190 l16 16 M740 190 l-16 16"/>
      <path d="M724 240 l16 16 M740 240 l-16 16"/>
      <path d="M724 290 l16 16 M740 290 l-16 16"/>
      <path d="M724 340 l16 16 M740 340 l-16 16"/>
      <path d="M724 390 l16 16 M740 390 l-16 16"/>
      <path d="M724 440 l16 16 M740 440 l-16 16"/>
      <path d="M724 490 l16 16 M740 490 l-16 16"/>
      <path d="M724 540 l16 16 M740 540 l-16 16"/>
      <path d="M724 590 l16 16 M740 590 l-16 16"/>
    </g>

    <g fill="currentColor" fill-opacity="0.12">
      <rect x="560" y="150" width="80" height="34"/>
      <rect x="560" y="184" width="40" height="34"/><rect x="600" y="184" width="40" height="34"/>
      <rect x="560" y="218" width="80" height="34"/>
      <rect x="560" y="252" width="40" height="34"/><rect x="600" y="252" width="40" height="34"/>
      <rect x="560" y="286" width="80" height="34"/>
      <rect x="560" y="320" width="40" height="34"/><rect x="600" y="320" width="40" height="34"/>
      <rect x="560" y="520" width="40" height="34"/><rect x="600" y="520" width="40" height="34"/>
      <rect x="560" y="554" width="80" height="34"/>
      <rect x="560" y="588" width="40" height="34"/><rect x="600" y="588" width="40" height="34"/>
      <rect x="560" y="622" width="80" height="28"/>
    </g>

    <path d="M600 150 V354" stroke="var(--section-accent, currentColor)" stroke-width="2.5" stroke-dasharray="6 6"/>
    <g stroke="var(--section-accent, currentColor)" stroke-width="3">
      <path d="M560 520 V394 a40 40 0 0 1 80 0 V520 Z" fill="var(--section-accent, currentColor)" fill-opacity="0.12"/>
      <path d="M580 370 V520 M600 355 V520 M620 370 V520" opacity="0.75"/>
      <path d="M560 440 H640 M560 480 H640" opacity="0.75"/>
      <rect x="588" y="455" width="24" height="18" rx="3" fill="var(--section-accent, currentColor)" fill-opacity="0.35"/>
      <path d="M593 455 v-7 a7 7 0 0 1 14 0 v7"/>
    </g>

    <path d="M710 437 H652" opacity="0.7" stroke-dasharray="6 6"/>
    <path d="M660 429 l-8 8 l8 8" opacity="0.7"/>

    <text x="600" y="72" text-anchor="middle" fill="var(--section-accent, currentColor)" stroke="none" font-size="24" font-weight="bold">reviewed decision</text>
    <text x="600" y="102" text-anchor="middle" fill="currentColor" stroke="none" font-size="22" opacity="0.7">named validation bar</text>
    <path d="M600 116 V150" stroke="var(--section-accent, currentColor)" stroke-width="2.5"/>
    <path d="M592 142 l8 8 l8 -8" stroke="var(--section-accent, currentColor)" stroke-width="2.5"/>

    <text x="600" y="712" text-anchor="middle" fill="currentColor" stroke="none" font-size="22" opacity="0.6">a packet must list all nine barred outputs or the validator rejects it</text>
  </g>
</svg>
