name: Monthly discoverability check

on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  discoverability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Checks the deployed site, not the build: a dropped page, a stale Pages
      # deploy, or a crawl-policy accident are all invisible to CI's build-time
      # checks because those only ever see the commit.
      - name: Check the live site's discoverability surfaces
        id: disco
        run: |
          set +e
          node scripts/check-discoverability.mjs > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open issue if the live site regressed
        if: steps.disco.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site discoverability report $(date +%Y-%m)"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body-file report.txt --label maintenance || gh issue create --title "$title" --body-file report.txt
          else
            echo "open issue already exists, skipping"
          fi
