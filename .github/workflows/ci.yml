name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The sitemap's <lastmod> is stamped from the HEAD commit date at build
      # time. Output is built and committed *before* that commit exists, so a
      # fresh CI build would otherwise compute a newer date and fail the diff
      # gate on any commit made on a different UTC day than its parent. Pin the
      # build to the committed sitemap's date so the sitemap reproduces exactly;
      # every other file is still built from scratch and checked below.
      - name: Pin sitemap lastmod for reproducible build
        run: echo "SITE_LASTMOD=$(grep -m1 -oP '(?<=<lastmod>)[^<]+' sitemap.xml)" >> "$GITHUB_ENV"

      - name: Build site
        run: npm run build

      - name: Build reproducibility gate
        run: |
          git diff --stat
          git diff --exit-code

      - name: Asset budgets
        run: node scripts/check-budgets.mjs

      - name: Internal link check
        run: node scripts/check-links.mjs

      - name: Smoke test (console errors, reveal, lightbox, theme)
        run: node scripts/smoke.mjs

      - name: Accessibility scan (axe-core)
        run: node scripts/check-a11y.mjs

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
